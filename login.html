<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keyword" content="tela de login">
    <title>Tela de Login</title>

    

    <style>


    .login{
        background-color: lightgrey;
        padding: 20px;
        text-align: center;

    }</style>
</head>
<body>

    <div class="login">

    <h1>Login</h1>
    
    <form>
        <label for="campo_email">E-mail:</label>
        <input id="campo_email" type="email" placeholder="Digite seu e-mail" required>
        
        <br>
        <br>

        <label for="campo_senha">Senha:</label>
        <input id="campo_senha" type="password" placeholder="Digite sua senha" required>
       
        <br>
        <br>
        
        <input type="submit" value="Login">

        <br> 
        <br>
         <a href="#">Esqueci minha senha</a>
         
         <br>
         <br>
            <a href="#">Ainda não tem uma conta?</a>
        <br>

    </form>
    
    
    </div>
    
</body>
</html>
